# .github/workflows/fpl-model.yml
# ⚠️ RETIRED 2026-09-28 — FPLanner no longer runs as a Cloudflare-hosted site.
# It now lives as a Cowork persisted artifact ("fplanner"): the same Python builders regenerate the
# feeds in-session and build_artifact.py bakes them into the artifact HTML (see model-app/refresh_artifact.sh),
# which is published via update_artifact. No GitHub Actions, no Cloudflare, no wrangler.
# Auto-triggers (push + schedule) removed so this never runs or deploys on its own. Kept manual-only
# (workflow_dispatch) purely as a fallback; the deploy step below still targets Cloudflare if ever run.

name: FPL — build & deploy (RETIRED)

on:
  workflow_dispatch: {}   # manual only — retired; artifact refresh replaces this

concurrency:
  group: fpl-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model deps
        run: pip install pandas numpy scipy

      # carry the live odds snapshot forward so build_odds can see its age (throttle)
      - name: Carry over odds snapshot + market ledger from the live site
        run: |
          curl -fsS https://wirtzplay.pages.dev/odds.json -o model-app/site/odds.json \
            && echo "carried over odds snapshot" || echo "no live odds yet (first run or odds off)"
          curl -fsS https://wirtzplay.pages.dev/market_history.json -o model-app/site/market_history.json \
            && echo "carried over market ledger" || echo "no market ledger yet"

      - name: Build live squad + league (v2.json)
        run: V2_OUT=model-app/site/v2.json python3 model-app/build_v2.py

      - name: Build xG feed (xg.json)
        run: XG_OUT=model-app/site/xg.json python3 model-app/build_xg.py

      - name: Build fixtures (fixtures.json)
        run: FIXTURES_OUT=model-app/site/fixtures.json python3 model-app/build_fixtures.py

      - name: Refresh bookmaker odds (throttled)
        run: ODDS_OUT=model-app/site/odds.json python3 model-app/build_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # a manual run (the in-app Rebuild button) forces a fresh odds fetch; schedule/push don't
          FORCE_ODDS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Build title odds (titleodds.json)
        run: FPL_OUT_DIR="$PWD/model-app/site" python3 model-app/build_titleodds.py



      # Core-Insights enrichment: refresh the underlying technical layer (npxG, DefCon/90,
      # GK goals-prevented, xG-regression signal) BEFORE build_players consumes it. Fail-soft &
      # commit-guarded: only re-ingests when the upstream changed; any failure keeps the committed feed.
      - name: Refresh Core-Insights enrichment (player_enrich.json)
        continue-on-error: true
        run: bash model-app/refresh_enrich.sh
        env:
          CI_REPO: olbauday/FPL-Core-Insights
          CI_BRANCH: codex/data-integration-review
          CI_SEASON: "2025-2026"

      - name: Build players (players.json)
        run: PLAYERS_OUT=model-app/site/players.json ENRICH_PATH=model-app/site/player_enrich.json python3 model-app/build_players.py

      - name: Build transfer targets (recommend.json)
        run: REC_OUT=model-app/site/recommend.json python3 model-app/build_recommend.py

      - name: Build optimal squad (squad.json)
        run: SQUAD_OUT=model-app/site/squad.json python3 model-app/build_squad.py

      - name: Build chip plan (chips.json)
        run: CHIPS_OUT=model-app/site/chips.json python3 model-app/build_chips.py

      # Deploy via `npx wrangler` directly rather than cloudflare/wrangler-action@v3 — the action is
      # fetched from codeload.github.com, which intermittently 429s and silently fails the whole deploy
      # (leaving the site frozen at the last good build). npx pulls wrangler from npm instead, with a
      # one-shot retry, so a transient blip no longer strands the feeds.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          deploy() { npx --yes wrangler@3 pages deploy model-app/site --project-name=wirtzplay --branch=main --commit-dirty=true; }
          deploy || { echo "deploy failed, retrying in 20s"; sleep 20; deploy; }
